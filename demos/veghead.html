<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Veghead Calculator</title>
    <style>
        button {
            margin-top: 1ch;
            min-height: 4ch;
            min-width:  4ch;
        }
    </style>
</head>
<body>
<div id="thing"></div>
<br/>
total:<span id="totale">0</span>
<button onclick="location.reload();">RESET</button>
<script>
    var data = `
Arugula:4.25
Cabbage (green):6
Cucumbers (lebanese):5.5
Green onions(early season):3
Green onions(small bunch):2.5
Green onions(big bunch):3.5
Herbs (chives, cilantro, dill, basil, dried summer savory):3
Kohlrabi:5
Microgreens (alfalfa, arugula, broccoli, buckwheat, pea, radish, sunflower):6
Microgreens take home tray:5
Radish:3.5
Rapini:3.25
Salad mix(large):6.25
Salad mix(small):4.25
Spinach(large):6.25
Spinach(small):4.25
Sunchokes:6
    `;
    var total =0;

    function row(name,price, index) {
        return `
<span id="item_${index}">0</span>
<span style="">${name} ${price}$</span>
<button onclick="btnclick(1,${price},${index})">+</button>
<button onclick="btnclick(-1,${price},${index})">-&nbsp</button>
`
    }
    function btnclick(up, price,index) {
        var amountel = document.getElementById("item_"+index)
        var num = parseInt(amountel.innerText)
        if (up<0 && num>0) {
            num--
            total-=price
        }
        if (up>0) {
            num++
            total+=price
        }
        amountel.innerText=num
        totale.innerHTML=total
    }


    data = data.trim()
        .split("\n")
        .map((line,i)=>{
            var [name,price]=line.split(":")
            var markup = row(name,price,i)
            return markup
        });
    thing.innerHTML=data.join("<br/>");
</script>
</body>

</html>
